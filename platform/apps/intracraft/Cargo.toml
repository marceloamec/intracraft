[package]
name = "intracraft"
description = "IntraCraft: pallet conveyor design and simulation on BIMCraft, in three modules (Design, Discrete simulation, Physics simulation)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.95"
publish = false

[lints]
workspace = true

[dependencies]
bimcraft-core = { workspace = true }
bimcraft-ui-egui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
intracraft-library = { path = "../../sim/library" }
intracraft-model = { path = "../../sim/model" }
intracraft-des = { path = "../../sim/des" }
intracraft-script = { path = "../../sim/script" }
intracraft-physics = { path = "../../sim/physics" }
intracraft-avian = { path = "../../sim/avian" }
intracraft-assets = { path = "../../sim/assets" }
intracraft-scene = { path = "../../sim/scene" }

serde_json = { workspace = true }
tiny-skia = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
