[package]
name = "intracraft-avian"
description = "IntraCraft's physics bench on Avian, Bevy's physics (ADR-0026): the engine of the Physics simulation module behind the common PhysicsBench contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
avian3d = { workspace = true }
bevy = { workspace = true, features = ["std", "default_app"] }
intracraft-library = { path = "../library" }
intracraft-physics = { path = "../physics" }
