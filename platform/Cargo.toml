[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "sim/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# GUIDs: the system's random numbers.
getrandom = "0.3"
tempfile = "3"
rayon = "1.12"
bimcraft-core = { path = "crates/core" }
bimcraft-i18n = { path = "crates/i18n", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
# Deflates PDF streams; png, under tiny-skia, already builds it.
flate2 = "1"
# Reads the JPEGs a texture is made of; the PNGs come in through tiny-skia.
zune-jpeg = "0.5"
bimcraft-ui-egui = { path = "crates/ui-egui" }
bimcraft-update = { path = "crates/update" }
# The Revit reader: Apache-2.0 only, so the command line and the desktop take it through an optional feature.
bimcraft-rvt = { path = "crates/rvt" }
# The DWG bridge: MIT OR Apache-2.0 itself, over acadrust (MPL-2.0, unmodified); the core never depends on it.
bimcraft-dwg = { path = "crates/dwg" }
egui = "0.36"
eframe = "0.36"
egui_kittest = "0.36"
rfd = "0.17"
# The system's language, on Windows and macOS too, where no environment variable says it.
sys-locale = "0.3"
# The updater's: versions, HTTPS (rustls, with ring and the Mozilla roots built in) and SHA-256 (ring's, the one rustls brings).
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
# The Revit reader's: Revit's files are Compound Files (OLE), and a byte search that scans the partitions fast.
cfb = "0.15"
memchr = "2"
# Text notes' fonts: IBM Plex's outlines, its weights too, read from the files the packages carry.
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
# IntraCraft (ADR-0026): Bevy draws the 3D run in its own window, Avian is the physics of the Physics simulation module.
# Pinned; upgraded together at most twice a year. Each crate turns on the parts of Bevy it uses.
bevy = { version = "=0.20.1", default-features = false }
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f64", "enhanced-determinism"] }
bevy_egui = { version = "=0.43.0", default-features = false, features = ["render", "default_fonts"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"

# The 3D view renders in software: build the core optimised in debug builds too, so it orbits smoothly.
[profile.dev.package.bimcraft-core]
opt-level = 2

# The Revit reader inflates and scans tens of megabytes per file, which its real-file tests do over and over.
[profile.dev.package.bimcraft-rvt]
opt-level = 2
# DWG files are decoded bit by bit.
[profile.dev.package.acadrust]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2
[profile.dev.package.cfb]
opt-level = 2

# IntraCraft: the physics runs thousands of steps in its tests; build Rapier and the physics crate optimised in debug too.
[profile.dev.package.rapier3d]
opt-level = 3

[profile.dev.package.parry3d]
opt-level = 3

[profile.dev.package.intracraft-physics]
opt-level = 3

# Avian (ADR-0026), the same: its tests and the examples' runs step thousands of times.
[profile.dev.package.avian3d]
opt-level = 3

[profile.dev.package.parry3d-f64]
opt-level = 3

[profile.dev.package.intracraft-avian]
opt-level = 3
