[package]
name = "r5b-viewer-bevy"
description = "Spike R5b: the benchmark scene drawn with Bevy (lights, shadows, native glTF)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
r5b-scene = { workspace = true }
bevy = { version = "=0.20.0", default-features = false, features = ["default_app", "std", "bevy_winit", "x11", "multi_threaded", "default_font", "3d_bevy_render", "scene", "tonemapping_luts"] }
bevy_egui = { version = "=0.43.0", default-features = false, features = ["render", "default_fonts"] }
